# b.363 — Fino a oggi non esisteva NESSUN controllo automatico: nessuna
# azione su GitHub, nessun aggancio a git. Chiunque poteva mandare in
# alto codice che non passava il verificatore o che rompeva le prove, e
# nessuno se ne accorgeva finche non lo scopriva un essere umano a mano.
# Da qui in avanti ogni invio e ogni proposta di modifica vengono
# passati al setaccio prima che qualcuno li legga.
name: Controlli

on:
  push:
  pull_request:

jobs:
  controlli:
    name: Verificatore e prove
    runs-on: ubuntu-latest

    steps:
      - name: Prendi il codice
        uses: actions/checkout@v4

      - name: Prepara Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installa le dipendenze esatte
        run: npm ci

      - name: Verificatore
        run: npx eslint app middleware.js

      - name: Prove
        run: npx vitest run --reporter=dot
