# ═══════════════════════════════════════════════════════════════
# BarTalk — coturn (b.282)
# Il ponte per le chiamate quando i telefoni non si vedono da soli.
# Schema di autenticazione: REST (use-auth-secret) — le credenziali le
# genera /api/turn di BarTalk con lo stesso segreto, e scadono da sole.
# ═══════════════════════════════════════════════════════════════

listening-port=3478
tls-listening-port=5349

# ── il segreto condiviso: DEVE essere IDENTICO a TURN_SECRET su Vercel ──
use-auth-secret
static-auth-secret=CAMBIAMI_SEGRETO_LUNGO_E_CASUALE

realm=turn.bartalk.app

# ── porte del traffico: una finestra stretta, non tutto il range ──
min-port=49160
max-port=49260

# ── l'indirizzo pubblico della VM (Oracle lo mostra nella console) ──
# external-ip=IP_PUBBLICO_DELLA_VM

# ── TLS (dopo il certificato: certbot certonly --standalone -d turn.bartalk.app) ──
# cert=/etc/letsencrypt/live/turn.bartalk.app/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.bartalk.app/privkey.pem

# ── igiene ──
fingerprint
no-cli
no-loopback-peers
no-multicast-peers
# il relay non deve raggiungere la rete interna della VM
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
# tetto per utente e totale (kbytes/sec): protegge la banda gratuita
max-bps=1500000
user-quota=12
total-quota=1200
log-file=/var/log/turnserver.log
simple-log
