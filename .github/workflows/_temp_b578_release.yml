name: temp-b578-release

on:
  push:
    branches: [b863-pronto]

permissions:
  contents: write

jobs:
  bump-release-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b863-pronto
          fetch-depth: 0

      - name: Allinea b.578 push 863 e cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          constants = Path('voice-translator-vercel/app/lib/constants.js')
          text = constants.read_text()
          text2 = text.replace("export const APP_VERSION = 'b.577';", "export const APP_VERSION = 'b.578';")
          text2 = text2.replace('export const PUSH = 862;', 'export const PUSH = 863;')
          if text2 == text:
              raise SystemExit('constants.js: marcatori attesi non trovati')
          constants.write_text(text2)

          sw = Path('voice-translator-vercel/public/sw.js')
          text = sw.read_text()
          text2 = text.replace('const CACHE_VERSION = 862;', 'const CACHE_VERSION = 863;')
          if text2 == text:
              raise SystemExit('sw.js: CACHE_VERSION attesa non trovata')
          sw.write_text(text2)

          claude = Path('voice-translator-vercel/CLAUDE.md')
          text = claude.read_text()
          marker = '## Stato corrente (aggiornare a ogni versione)\n\n'
          if marker not in text:
              raise SystemExit('CLAUDE.md: sezione Stato corrente non trovata')
          if 'Versione: **b.578** (push #863)' not in text:
              stato = '''- Versione: **b.578** (push #863) — COERENZA DEL MOTORE MONDO, senza modifiche all'interfaccia.\n\n  Quattro difetti reali emersi dall'audit del percorso ricerca → normalizzazione → ranking → regia → feed:\n  ① le query rapide legacy non coincidevano sempre con le domande canoniche del motore nuovo; ora gli alias entrano negli stessi ID canonici senza indovinare le ricerche libere.\n  ② il Ranker spezzava il testo con un tokenizer ASCII; ora la pertinenza della domanda esplicita e' Unicode, con `Intl.Segmenter` e fallback Unicode.\n  ③ i contenuti nascosti partecipavano a Ranker/Director e venivano tolti solo alla fine; ora vengono eliminati prima della Regia.\n  ④ `ponte.js` prometteva le stesse schede ma creava copie con `{...s}`; ora annota e restituisce le stesse istanze, preservando la guardia asincrona dei segnali.\n\n  PROVE: `mondo-coerenza-b578.test.js` 7/7, `mondo-fase5-b577` 17/17, `mondo-ranker-b576` 27/27, lint 0 errori. La suite completa resta rossa solo per i quattro test SubtleCrypto gia' rossi su `main` (PeepOff x3, Taxi x1): nessun nuovo fallimento Mondo.\n\n'''
              text = text.replace(marker, marker + stato, 1)
              claude.write_text(text)
          PY

      - name: Commit sul ramo di rilascio
        shell: bash
        run: |
          git config user.name "tmwe-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add voice-translator-vercel/app/lib/constants.js voice-translator-vercel/public/sw.js voice-translator-vercel/CLAUDE.md
          if git diff --cached --quiet; then
            echo "Marcatori gia allineati"
          else
            git commit -m "b.578 — allinea versione push e cache"
            git push origin HEAD:b863-pronto
          fi
