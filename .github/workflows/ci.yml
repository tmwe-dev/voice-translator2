name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: voice-translator-vercel

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voice-translator-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero errors required)
        run: npx eslint app/ middleware.js --max-warnings 200

      - name: Unit + integration tests
        run: npm test

  production-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: voice-translator-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel deploy to settle
        run: sleep 90

      - name: Production smoke tests (privacy guards live)
        run: npx playwright test --config=playwright.prod.config.js
