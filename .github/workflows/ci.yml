# ═══════════════════════════════════════════════════════════════
# b.408 — IL CANCELLO CHE MANCAVA.
#
# Un audit esterno del 23/08/2026 ha notato che qui giravano lint e
# prove, ma NON la costruzione del prodotto. Verificato: era vero.
# Quindi era possibile questo, ed e gia successo nella storia recente:
#
#   2377 prove verdi -> verificatore verde -> `next build` ROTTO
#
# Una prova verde non dimostra che l'applicazione si costruisca: le
# prove girano sui moduli, la costruzione monta le pagine. Sono due
# domande diverse e finora ne facevamo una sola.
#
# ONESTA SU COSA QUESTO CANCELLO PUO' E NON PUO' FARE: Vercel pubblica
# da solo a ogni invio su main, e non aspetta questo controllo. Quindi
# oggi il cancello vale davvero sulle PROPOSTE DI MODIFICA, e su main e
# un allarme che suona presto — non una sbarra. Per farlo diventare una
# sbarra vera servono due cose che stanno nelle mani di Luca, non nel
# codice: la protezione del ramo main su GitHub (con questo controllo
# obbligatorio), oppure spegnere la pubblicazione automatica di Vercel e
# lasciarla a questo flusso. Finche non c'e, non si scrive da nessuna
# parte che «la CI protegge la produzione».
#
# b.408 — CONSOLIDATO IN UNA CARTELLA SOLA. Esisteva anche
# `voice-translator-vercel/.github/workflows/controlli.yml`, che GitHub
# non ha MAI eseguito: i flussi di lavoro si leggono solo dalla
# `.github/workflows` alla radice del deposito. Era un controllo che
# sembrava esserci e non c'era.
#
# b.583 — IL CONTROLLO E IL COMANDO LOCALE DEVONO ESSERE LO STESSO.
# Prima la CI lintava solo app/ e middleware.js, mentre `npm run lint`
# controllava anche __tests__/ ed e2e/. Inoltre Node 20 era gia sotto il
# requisito dichiarato da dipendenze installate. Da qui in avanti il
# workflow usa Node 22 e chiama il comando canonico del package.
# ═══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: voice-translator-vercel

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-translator-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (stesso comando usato in locale)
        run: npm run lint

      - name: Unit + integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      # Diagnostica soltanto: non rende verde una prova rossa. Conserva
      # l'output di Vitest cosi un errore del cancello resta leggibile
      # anche dai client che non espongono i log grezzi di Actions.
      - name: Preserve Vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log
          path: voice-translator-vercel/vitest.log
          if-no-files-found: ignore
          retention-days: 1

      # b.408 — LA DOMANDA CHE NESSUNO FACEVA: si costruisce?
      # Va dopo le prove (che sono piu veloci a dire di no) e prima di
      # qualunque cosa guardi la produzione.
      - name: Production build (il prodotto deve costruirsi)
        run: npm run build
        env:
          # La costruzione non deve dipendere da segreti veri: qui
          # servono solo a far passare la validazione delle variabili.
          # Se un giorno la costruzione avesse bisogno di un segreto
          # VERO, sarebbe un difetto da correggere li, non qui.
          NEXT_TELEMETRY_DISABLED: '1'

  production-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-translator-vercel/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel deploy to settle
        run: sleep 90

      - name: Production smoke tests (privacy guards live)
        run: npx playwright test --config=playwright.prod.config.js
